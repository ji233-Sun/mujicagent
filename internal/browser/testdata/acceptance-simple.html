<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrowserUse controlled page</title>
<style>
body { font: 16px/1.6 sans-serif; margin: 24px; background: #fff; color: #222; }
label, output { display: block; margin: 12px 0; }
input, button { font: inherit; }
.space { height: 1400px; background: linear-gradient(#f5f8f7, #dce7e3); }
</style>
<h1>BrowserUse controlled page</h1>
<p>Only synthetic local test data.</p>
<label>Controlled text <input id="controlled" autocomplete="off"></label>
<output id="model">Model: empty</output>
<button id="commit">Commit controlled text</button>
<output id="committed">Nothing committed</output>
<form action="acceptance-simple.html" method="get">
  <label>Form query <input name="q" autocomplete="off"></label>
  <output id="query">Query: empty</output>
  <button type="submit">Navigate with form</button>
</form>
<output id="navigation">Initial document</output>
<div class="space">Main viewport scroll area</div>
<p>Bottom marker</p>
<script>
const byID = id => document.getElementById(id);
let model = "";
byID("controlled").addEventListener("input", event => {
  model = event.target.value;
  byID("model").textContent = "Model: " + (model || "empty");
});
byID("commit").addEventListener("click", () => {
  byID("committed").textContent = "Committed: " + (model || "empty");
});
document.querySelector("[name=q]").addEventListener("input", event => {
  byID("query").textContent = "Query: " + (event.target.value || "empty");
});
const query = new URLSearchParams(location.search).get("q");
if (query !== null) byID("navigation").textContent = "Navigation complete: " + query;
</script>
</html>
