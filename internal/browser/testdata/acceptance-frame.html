<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>BrowserUse frame fixture</title>
<body>
  <h2>Frame fixture</h2>
  <button id="frame-click">Change frame text</button>
  <output id="frame-result">Frame unchanged</output>
  <script>
    document.getElementById("frame-click").addEventListener("click", () => {
      document.getElementById("frame-result").textContent = "Frame changed";
    });
  </script>
</body>
</html>
