- semver: 0.3.0
  date: 2026-09-27T21:18:38.600312391Z
  packager: Dj Gilcrease <digitalxero@gmail.com>
  changes:
    - commit: ee14cdc6b48f5b824d547d6437ef69d688848e62
      note: |-
        feat: emit ISA-qualified and epoch-aware self provides

        A built binary package now provides itself the same way rpmbuild does for
        %{name} and %{name}%{?_isa}:

            name = [epoch:]version-release
            name(<isa>) = [epoch:]version-release

        The ISA comes from the new ISA(arch) helper, which mirrors the architecture
        table in rpm's installplatform script (x86_64 -> x86-64, aarch64 ->
        aarch-64, ppc64le -> ppc-64, ...). noarch, source packages and unknown
        architectures get no ISA provide. The plain self provide now carries the
        epoch when one is set, which it previously dropped.

        Red Hat software certification checks for the ISA provide
        (goreleaser/nfpm#1140).

        Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
      author:
        name: Dj Gilcrease
        email: digitalxero@gmail.com
      committer:
        name: Dj Gilcrease
        email: digitalxero@gmail.com
