name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          go tool mygo generate
          git diff --exit-code -- locales/catalog_gen.go
          go tool mygo vet .
          CGO_ENABLED=0 go test ./... -count=1
          go test -race ./internal/harness ./internal/codex ./internal/controller -count=1
          go vet ./...
          go tool mygo i18n check
      - name: Build macOS
        run: go tool mygo build -platform "darwin/arm64,darwin/amd64"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-preview
          path: build/**/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Windows
        run: |
          go tool mygo generate
          git diff --exit-code -- locales/catalog_gen.go
          go tool mygo vet .
          # Release shell integration tests run in the macOS job.
          CGO_ENABLED=0 go test . ./internal/... ./locales/... -count=1
          go vet ./...
          go tool mygo i18n check
      - name: Verify harness packages on Windows
        run: |
          MUJICAGENT_INSTALL_TEST=official go test ./internal/harness -run TestDownloadNativePackage -v -count=1
          MUJICAGENT_INSTALL_TEST=cn go test ./internal/harness -run TestDownloadNativePackage -v -count=1
          for driver in pi droid; do
            MUJICAGENT_INSTALL_TEST=official MUJICAGENT_INSTALL_DRIVER="$driver" go test ./internal/harness -run TestDownloadNativePackage -v -count=1
            MUJICAGENT_INSTALL_TEST=npm MUJICAGENT_INSTALL_DRIVER="$driver" go test ./internal/harness -run TestDownloadNativePackage -v -count=1
          done
      - name: Build Windows installers
        run: |
          go tool mygo build -platform "windows/amd64,windows/arm64"
          version="$(jq -r .version mygo.json)"
          for arch in amd64 arm64; do
            test -s "build/windows-$arch/mujicagent-setup-$version-$arch.exe"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-preview
          path: build/windows-*/mujicagent-setup-*.exe
          if-no-files-found: error
          retention-days: 7
