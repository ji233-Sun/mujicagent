name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: Build and notarize without publishing (also allowed on branches)
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # GitHub's generate-notes endpoint requires write access.
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Verify
        run: |
          go tool mygo generate
          git diff --exit-code -- locales/catalog_gen.go
          go tool mygo vet .
          CGO_ENABLED=0 go test ./... -count=1
          go test -race ./internal/codex ./internal/controller -count=1
          go vet ./...
          go tool mygo i18n check
      - name: Build or restore signed checkpoint
        id: build
        env:
          BUMP: ${{ inputs.bump }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bash scripts/release/macos.sh build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.build.outputs.cached != 'true'
        with:
          name: release-build
          path: build-state/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/mujicagent-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/mujicagent-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"

  submit:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Submit or restore Apple submission
        id: submit
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash scripts/release/macos.sh submit
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && steps.submit.outputs.cached != 'true'
        with:
          name: release-submission-${{ matrix.arch }}
          path: submit-state/submission.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary-key.p8"

  finalize:
    needs: submit
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Wait, staple, and sign final update
        id: finalize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bash scripts/release/macos.sh finalize
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.finalize.outputs.cached != 'true'
        with:
          name: release-final-${{ matrix.arch }}
          path: final-state/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: notary-logs-${{ matrix.arch }}-${{ github.run_attempt }}
          path: notary-logs/
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary-key.p8"

  windows:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install Windows packaging tools
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build or restore Windows checkpoint
        id: windows
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bash scripts/release/macos.sh windows
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.windows.outputs.cached != 'true'
        with:
          name: release-final-windows
          path: final-state/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [finalize, windows]
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish verified checkpoints
        run: bash scripts/release/macos.sh publish
